slug: ben-portfolio
nom: Portfolio Benjamin Balayre
nature: vitrine
cycle: maintenance
criticite: basse
resume: Site CV et portfolio personnel bilingue FR/EN.
chemin_local: ~/ben-portfolio
depot: AlexisBalayre/ben-portfolio
demarre_le: 2024-05-06
stack: [Next.js 15 Pages Router, React 19, TypeScript, Tailwind, DaisyUI, next-i18next, Framer Motion, Vercel]
surfaces:
  - env: prod
    url: https://benjamin.balayre.com
    provider: vercel
    # Pas de `ref` : le site tourne bien sur Vercel — les en-têtes le disent —
    # mais le projet n'appartient à aucune des deux équipes joignables avec le
    # jeton de Benjamin (iseplifes-projects, seed4soft). Il est déployé depuis
    # le compte qui porte le dépôt, AlexisBalayre/ben-portfolio.
    #
    # Une `ref` qui ne résout pas est pire qu'une absence : la collecte des
    # déploiements rendait « 0 déploiement sur 30 jours », ce qui se lit comme
    # un projet à l'arrêt. Sans `ref`, le Hub n'interroge rien et n'affirme
    # rien. Pour la rétablir, il faut transférer le projet Vercel ou obtenir un
    # jeton sur le compte qui l'héberge.
objectifs:
  - id: bilingue
    libelle: >-
      Site bilingue tenu — canonical par locale, bascule FR/EN segmentée
    fait: true
  - id: cv-neutre
    libelle: >-
      Le CV reste neutre et renvoie la prestation photo et vidéo vers
      Benevolence Prestations
    fait: true
  - id: refonte-timeline
    libelle: Refonte de la timeline et de l'arbre de compétences
    avancement: 40
relations: []
tags: [vitrine, perso, cv]
services:
  - nom: Vercel Hobby
    categorie: hebergement
    role: Hébergement du portfolio
    cout: 0
    base: gratuit
    console: https://vercel.com
  - nom: Cloudflare DNS
    categorie: domaine
    role: Zone DNS de balayre.com
    cout: 0
    base: gratuit
    console: https://dash.cloudflare.com
architecture:
  zones:
    - id: vercel
      label: Vercel Hobby
  noeuds:
    - { id: visiteur, label: Visiteur,        type: acteur }
    - { id: cf,       label: Cloudflare DNS,  sous: balayre.com,          type: edge }
    - { id: site,     label: Next.js 15,      sous: "Pages Router, FR/EN", type: app, zone: vercel }
    - { id: contenu,  label: Contenus JSON,   sous: "Expériences, formation", type: donnees, zone: vercel }
  liens:
    - { de: visiteur, vers: cf,   label: DNS }
    - { de: cf,       vers: site, label: HTTPS }
    - { de: site,     vers: contenu, label: build }
